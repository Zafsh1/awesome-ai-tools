name: FreeFlow
options:
  bundleIdPrefix: com.zafsh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  FreeFlow:
    type: application
    platform: macOS
    sources:
      - path: FreeFlow
    settings:
      base:
        INFOPLIST_FILE: FreeFlow/Resources/Info.plist
        # App Sandbox is intentionally disabled (see FreeFlow.entitlements):
        # global hotkeys, synthetic keyboard events (paste-at-cursor), and
        # Accessibility APIs require a non-sandboxed process. Distribute
        # outside the Mac App Store.
        CODE_SIGN_ENTITLEMENTS: FreeFlow/FreeFlow.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.zafsh.freeflow
        PRODUCT_NAME: FreeFlow
